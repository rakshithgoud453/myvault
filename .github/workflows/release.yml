name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Cross-Platform Release Binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          make dist VERSION=${VERSION}

      - name: Create Release Package Archives
        run: |
          cd dist
          tar -czvf myvault-darwin-arm64.tar.gz myvault-darwin-arm64
          tar -czvf myvault-darwin-amd64.tar.gz myvault-darwin-amd64
          tar -czvf myvault-linux-amd64.tar.gz myvault-linux-amd64
          tar -czvf myvault-linux-arm64.tar.gz myvault-linux-arm64
          zip myvault-windows-amd64.zip myvault-windows-amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Auto-Update Homebrew Formula
        if: success()
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          SHA256=$(curl -sL https://github.com/rakshithgoud453/myvault/archive/refs/tags/${VERSION}.tar.gz | shasum -a 256 | awk '{print $1}')
          
          echo "Updating Formula/myvault.rb to version ${VERSION} with sha256 ${SHA256}"
          sed -i "s|url \".*\"|url \"https://github.com/rakshithgoud453/myvault/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/myvault.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/myvault.rb

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/myvault.rb
          git commit -m "chore(release): bump Homebrew formula to ${VERSION}" || true
          git push origin HEAD:main || true

          if [ -n "$TAP_TOKEN" ]; then
            git clone https://x-access-token:${TAP_TOKEN}@github.com/rakshithgoud453/homebrew-tap.git tap_repo
            mkdir -p tap_repo/Formula
            cp Formula/myvault.rb tap_repo/Formula/myvault.rb
            cd tap_repo
            git add Formula/myvault.rb
            git commit -m "bump myvault formula to ${VERSION}"
            git push origin main
          fi
